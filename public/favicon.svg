<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>VMH neuron</title>
  <rect width="64" height="64" rx="10" fill="#e9e2d4"/>
  <g fill="none" stroke="#8a3420" stroke-linecap="round" stroke-linejoin="round">
    <!-- apical (upper pole) dendrite -->
    <path d="M32 21 C 32 16, 33.5 12, 33 6" stroke-width="4.2"/>
    <path d="M33 9 C 33.5 6, 35 4, 37 3" stroke-width="2.4"/>
    <path d="M33.3 10 C 32 7, 30 5, 28.5 4" stroke-width="2"/>
    <!-- lower pole dendrite -->
    <path d="M32 40 C 31.5 45, 31 48, 30.5 52" stroke-width="4.2"/>
    <path d="M30.5 50 C 30 54, 29.5 57, 28.5 61" stroke-width="2.6"/>
    <path d="M30.8 50 C 33 53, 35 56, 36.5 60" stroke-width="2.2"/>
    <!-- side dendrite -->
    <path d="M28.5 34 C 24 36, 20 37.5, 15.5 40" stroke-width="3.8"/>
    <path d="M16.5 39.5 C 12.5 42, 9.5 45, 6.5 49" stroke-width="2.4"/>
    <path d="M17 39 C 14 37, 11 35, 7.5 34.5" stroke-width="2"/>
    <!-- axon: from the base of the lower dendrite, slanted -->
    <path d="M33.5 42.5 C 38 46, 43 51.5, 49 60" stroke-width="1.9"/>
  </g>
  <!-- spindle soma -->
  <path d="M32 18.5 C 38.5 24, 38.5 35, 32 41.5 C 25.5 35, 25.5 24, 32 18.5 Z" fill="#8a3420"/>
</svg>
